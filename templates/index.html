<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - CodeNova</title>
    <!-- Link CSS from static folder -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Expense Tracker</h1>
            <p>Manage your income and expenses seamlessly</p>
        </header>

        <!-- Form Section -->
        <section class="form-section">
            <h2>Add Transaction</h2>
            <form id="expense-form">
                <div class="input-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" required placeholder="e.g., Salary, Groceries">
                </div>
                <div class="input-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" step="0.01" required placeholder="0.00">
                </div>
                <div class="input-group">
                    <label for="type">Type</label>
                    <select id="type">
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="category">Category</label>
                    <!-- <input type="text" id="category" required placeholder="e.g., Food, Rent"> -->
                     <select id="category" required>
                        <!-- <option value="food">Food</option>
                        <option value="travel">Travel</option>
                        <option value="shopping">Shopping</option>
                        <option value="bills">Bills</option>
                        <option value="health">Health</option>
                        <option value="education">Education</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="other">Other</option> -->
                     </select>
                </div>
                <button type="submit" class="btn">Add Transaction</button>
            </form>
        </section>

        <!-- Transactions List -->
        <section class="list-section">
            <h2>Transaction History</h2>
            <ul id="transaction-list">
                <!-- Dynamically populated by JS -->
            </ul>
        </section>
    </div>

    <!-- Link JS from static folder -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
